<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ERP Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="container mx-auto p-6">
        <h1 class="text-2xl font-bold mb-6">ERP Dashboard</h1>

        <div class="grid grid-cols-3 gap-6">
            <div class="bg-white p-4 rounded shadow">
                <h2 class="text-lg font-semibold">Customers</h2>
                <p class="text-3xl">{{ customer_count }}</p>
            </div>
            <div class="bg-white p-4 rounded shadow">
                <h2 class="text-lg font-semibold">Vendors</h2>
                <p class="text-3xl">{{ vendor_count }}</p>
            </div>
            <div class="bg-white p-4 rounded shadow">
                <h2 class="text-lg font-semibold">Products</h2>
                <p class="text-3xl">{{ product_count }}</p>
            </div>
            <div class="bg-white p-4 rounded shadow">
                <h2 class="text-lg font-semibold">Sales Orders</h2>
                <p class="text-3xl">{{ sales_order_count }}</p>
            </div>
            <div class="bg-white p-4 rounded shadow">
                <h2 class="text-lg font-semibold">Purchase Orders</h2>
                <p class="text-3xl">{{ purchase_order_count }}</p>
            </div>
            <div class="bg-white p-4 rounded shadow">
                <h2 class="text-lg font-semibold">Employees</h2>
                <p class="text-3xl">{{ employee_count }}</p>
            </div>
        </div>
    </div>
</body>
</html>
