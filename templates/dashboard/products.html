{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Poppins', sans-serif;
    }
    .sidebar-item-active {
      background-color: #3498db;
      color: white;
    }
  </style>
</head>
<body class="bg-[#ecf0f1] text-[#2c3e50] p-5">

<div class="flex space-x-5 h-screen">
  <!-- Sidebar -->
  <div class="w-64 bg-[#2c3e50] text-white p-5 rounded-3xl flex flex-col items-center">
    <div class="flex items-center mb-10">
      <img src="{% static 'LW.png' %}" alt="Lite Work Logo" class="w-30 mr-2">
    </div>
    <nav class="w-full">
                <a href="{% url 'dashboard' %}" class="flex items-center p-3 rounded-lg mb-2 hover:bg-[#3498db] hover:text-white transition-colors duration-300 ">
                    <i class="fas fa-home mr-4 text-xl"></i>
                    <span>Dashboard</span>
                </a>
                <a href="{% url 'finance' %}" class="flex items-center p-3 rounded-lg mb-2 hover:bg-[#3498db] hover:text-white transition-colors duration-300">
                    <i class="fas fa-file-invoice-dollar mr-4 text-xl"></i>
                    <span>Finance and Billing</span>
                </a>
                <a href="{% url 'clients' %}" class="flex items-center p-3 rounded-lg mb-2 hover:bg-[#3498db] hover:text-white transition-colors duration-300">
                    <i class="fas fa-users mr-4 text-xl"></i>
                    <span>Clients</span>
                </a>
                <a href="{% url 'products' %}" class="flex items-center p-3 rounded-lg mb-2 hover:bg-[#3498db] hover:text-white transition-colors duration-300 sidebar-item-active">
                    <i class="fas fa-box mr-4 text-xl"></i>
                    <span>Products</span>
                </a>
                <a href="{% url 'activity' %}" class="flex items-center p-3 rounded-lg mb-2 hover:bg-[#3498db] hover:text-white transition-colors duration-300">
                    <i class="fas fa-clipboard-list mr-4 text-xl"></i>
                    <span>Activity Log</span>
                </a>
                <a href="{% url 'inbox' %}" class="flex items-center p-3 rounded-lg mb-2 hover:bg-[#3498db] hover:text-white transition-colors duration-300">
                    <i class="fas fa-inbox mr-4 text-xl"></i>
                    <span>Inbox</span>
                </a>
                <a href="{% url 'settings' %}" class="flex items-center p-3 rounded-lg mb-2 hover:bg-[#3498db] hover:text-white transition-colors duration-300">
                    <i class="fas fa-cogs mr-4 text-xl"></i>
                    <span>Settings</span>
                </a>
            </nav>
  </div>

  <!-- Main Content -->
  <div class="flex-grow flex flex-col space-y-5">
    <!-- Header -->
    <header class="flex justify-between items-center">
      <div class="flex items-center bg-white rounded-full px-4 py-2 w-1/2 shadow-md">
        <i class="fas fa-search text-gray-500 mr-2"></i>
        <input type="text" placeholder="Search..." class="w-full focus:outline-none">
      </div>
      <div class="flex items-center space-x-3">
        <button class="bg-[#2c3e50] text-white px-4 py-2 rounded-full hover:bg-[#3498db] transition flex items-center space-x-2">
          <i class="fas fa-shopping-cart"></i>
          <span>View Cart</span>
        </button>
        <button class="bg-[#2c3e50] text-white px-4 py-2 rounded-full hover:bg-[#3498db] transition flex items-center space-x-2">
          <i class="fas fa-plus"></i>
          <span>Add Product</span>
        </button>
        <i class="fas fa-bell text-2xl text-[#2c3e50] cursor-pointer"></i>
        <i class="fas fa-user-circle text-2xl text-[#2c3e50] cursor-pointer"></i>
      </div>
    </header>

    <!-- Product Cards -->
    <div class="bg-[#1a1a1a] rounded-2xl p-6 shadow-lg flex flex-col">
      <div class="flex justify-between items-center mb-4">
        <button class="bg-white rounded-full p-2 shadow hover:bg-gray-100"><i class="fas fa-chevron-left"></i></button>
        <button class="bg-white rounded-full p-2 shadow hover:bg-gray-100"><i class="fas fa-chevron-right"></i></button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Product Card -->
        <div class="bg-[#dbeafe] rounded-xl shadow p-4 flex flex-col items-center">
          <img src="{% static 'sateen.jpg' %}" alt="Sateen Fabric" class="rounded-lg mb-4">
          <h3 class="font-semibold text-lg">Sateen Fabric</h3>
          <p class="text-sm text-gray-700">₱2,750 – ₱11,000+</p>
          <p class="text-red-600 text-sm font-semibold">Not in Stock</p>
          <button class="mt-3 px-4 py-2 bg-black text-white rounded-full hover:bg-[#3498db] transition flex items-center space-x-2">
            <i class="fas fa-cart-plus"></i>
            <span>Add to Cart</span>
          </button>
        </div>

        <div class="bg-[#dbeafe] rounded-xl shadow p-4 flex flex-col items-center relative">
          <span class="absolute top-2 left-2 bg-[#3498db] text-white text-xs font-bold px-2 py-1 rounded">30%</span>
          <img src="{% static 'chiffon.jpg' %}" alt="Chiffon Fabric" class="rounded-lg mb-4">
          <h3 class="font-semibold text-lg">Chiffon Fabric</h3>
          <p class="text-sm line-through text-gray-500">₱400</p>
          <p class="text-sm text-gray-700">₱500+</p>
          <p class="text-red-600 text-sm font-semibold">In Stock</p>
          <button class="mt-3 px-4 py-2 bg-black text-white rounded-full hover:bg-[#3498db] transition flex items-center space-x-2">
            <i class="fas fa-cart-plus"></i>
            <span>Add to Cart</span>
          </button>
        </div>

        <div class="bg-[#dbeafe] rounded-xl shadow p-4 flex flex-col items-center">
          <img src="{% static 'lace.jpg' %}" alt="Lace Fabric" class="rounded-lg mb-4">
          <h3 class="font-semibold text-lg">Lace Fabric</h3>
          <p class="text-sm text-gray-700">₱1,900 – ₱2,500+</p>
          <p class="text-red-600 text-sm font-semibold">In Stock</p>
          <button class="mt-3 px-4 py-2 bg-black text-white rounded-full hover:bg-[#3498db] transition flex items-center space-x-2">
            <i class="fas fa-cart-plus"></i>
            <span>Add to Cart</span>
          </button>
        </div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
